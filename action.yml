name: "Verdica"
description: "Checks pull requests against the decisions recorded in .decisions/"
branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  base:
    description: "Base ref to diff against (e.g. the PR base branch)"
    required: false
    default: "main"
  fail-on:
    description: "'never' (report only) or 'block' (fail on high-confidence violations of block-severity decisions)"
    required: false
    default: "never"
  anthropic-api-key:
    description: "Optional. Enables the contradiction judge on Anthropic."
    required: false
    default: ""
  mistral-api-key:
    description: "Optional. Enables the contradiction judge on Mistral (the reference provider). Without any key the check reports which decisions govern the change."
    required: false
    default: ""
  comment:
    description: "Post the summary as a pull-request comment (needs pull-requests: write and github-token)"
    required: false
    default: "false"
  github-token:
    description: "Token used to post the comment"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Install verdica
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - name: Check diff against recorded decisions
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        git fetch --no-tags --depth=200 origin "${{ inputs.base }}"
        verdica check --base "origin/${{ inputs.base }}" \
          --fail-on "${{ inputs.fail-on }}" \
          ${{ inputs.comment == 'true' && '--comment' || '' }}
