[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisis"
version = "0.9.0"
description = "Team decisions as files in the repo, enforced on every diff."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
decisis = "decisis.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["decisis"]
